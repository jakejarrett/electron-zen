<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Electron App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Hello from Electron!</h1>
        <p>If you can see this, the Electron compatibility layer is working!</p>
        <p id="info"></p>
    </div>
    <script>
        document.getElementById('info').textContent = 
            `User Agent: ${navigator.userAgent.substring(0, 60)}...`;
    </script>
</body>
</html>
